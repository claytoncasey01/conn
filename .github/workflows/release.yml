# Publishing a release on GitHub builds conn for macOS and Linux (amd64 and arm64) from the
# release's tag and attaches the archives, their checksums and install.sh to it. A second job
# builds the macOS app, a universal Conn.app in a zip, and attaches it with its own checksums
# (checksums-app.txt). Nothing in this workflow runs on a push or a pull request (ci.yml tests
# those), and nothing is built from a branch.
name: release

on:
  release:
    types: [published]

# No job gets a token it does not name.
permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Read through the environment, never spliced into a script: a tag is text someone typed.
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      CONN_TEST_TIME_SCALE: "3"
    steps:
      - name: Check the tag
        run: |
          case "$TAG" in
          v[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "the tag '$TAG' is not a version such as v1.2.3" >&2; exit 1 ;;
          esac
          case "$TAG" in
          *[!0-9A-Za-z.+-]*) echo "the tag '$TAG' has characters a version does not" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install the page's dependencies
        run: bun install --frozen-lockfile

      # A release that fails its tests is not published. This also builds the page bundle the
      # binary embeds.
      - name: Test
        run: make test

      - name: Stamp the version
        run: printf '%s\n' "$TAG" > VERSION

      - name: Build the archives
        run: scripts/build-release.sh release-files

      - name: Attach them to the release
        run: gh release upload "$TAG" release-files/*.tar.gz release-files/checksums.txt install.sh --clobber

  # The app needs cgo and the macOS toolchain, so it is built on a Mac runner after the archives
  # are attached. It uploads only its own two files, so a re-run of either job leaves the other's
  # files as they are.
  app:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Read through the environment, never spliced into a script: a tag is text someone typed.
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install the page's dependencies
        run: bun install --frozen-lockfile

      - name: Stamp the version
        run: printf '%s\n' "$TAG" > VERSION

      # The app embeds the page bundle.
      - name: Build the page
        run: bun run build

      - name: Build the app
        run: scripts/build-app.sh release-files

      # The same checks as ci.yml's app bundle job, so a release never carries a zip CI would
      # have failed. The file names are those scripts/build-app.sh writes.
      - name: Check the signature
        run: |
          set -eu
          mkdir app-check
          unzip -q release-files/Conn_darwin_universal.zip -d app-check
          codesign --verify --deep --strict app-check/Conn.app

      - name: Check that the binary holds both architectures
        run: |
          set -eu
          archs=$(lipo -archs app-check/Conn.app/Contents/MacOS/conn-app)
          echo "archs: $archs"
          case "$archs" in
            *x86_64*) ;;
            *) echo "no x86_64 slice" >&2; exit 1 ;;
          esac
          case "$archs" in
            *arm64*) ;;
            *) echo "no arm64 slice" >&2; exit 1 ;;
          esac

      - name: Check that the binary starts
        run: |
          set -eu
          app-check/Conn.app/Contents/MacOS/conn-app --print-env > app-check/env.out
          tr -d '\0' < app-check/env.out | grep -q CONN-ENV-END

      - name: Attach it to the release
        run: gh release upload "$TAG" release-files/Conn_darwin_universal.zip release-files/checksums-app.txt --clobber

      # A release whose app job failed still has the CLI, and install.sh then says "this release
      # has no app". The summary says so on the run's page, so the failure is not silent.
      - name: Say that the release has no app
        if: failure()
        run: |
          {
            echo "## The app was not attached to $TAG"
            echo
            echo "The release has the command-line tool only: install.sh installs it and says"
            echo "\"this release has no app\". Fix the cause and re-run this job to add the app."
          } >> "$GITHUB_STEP_SUMMARY"
