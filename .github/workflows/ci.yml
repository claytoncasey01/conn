# Every pull request, and every push to main, runs the tests and the lint and type checks on Linux
# and macOS, and builds the macOS app bundle to check that it assembles, signs and starts. The
# bundle is not published: releases are made by release.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# No job gets a token it does not name.
permissions: {}

# A newer push to a pull request replaces its run; a run on main is never cancelled, so every
# merge keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The tests that wait on a clock run on shared runners, slower than a laptop.
      CONN_TEST_TIME_SCALE: "3"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install the page's dependencies
        run: bun install --frozen-lockfile

      # Builds the page bundle the binary embeds, then runs the UI tests and the Go tests with the
      # race detector, in random order.
      - name: Test
        run: make test

  # macOS is in the matrix because the app's files build only there, so Linux lint cannot see them.
  check:
    name: lint and type check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Pinned: a new linter release must not turn a green pull request red.
      GOLANGCI_LINT_VERSION: v2.15.0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install the page's dependencies
        run: bun install --frozen-lockfile

      - name: Install golangci-lint
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # make lint (every linter on, 0 issues) and then svelte-check.
      - name: Lint and type check
        run: make check

  app:
    name: app bundle (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install the page's dependencies
        run: bun install --frozen-lockfile

      # The app embeds the page bundle.
      - name: Build the page
        run: bun run build

      - name: Build the app bundle
        run: scripts/build-app.sh app-files

      # The zip is unpacked as a user would unpack it, so a seal broken by the zip itself shows.
      - name: Check the signature
        run: |
          set -eu
          mkdir app-check
          unzip -q app-files/Conn_darwin_universal.zip -d app-check
          codesign --verify --deep --strict app-check/Conn.app

      - name: Check that the binary holds both architectures
        run: |
          set -eu
          archs=$(lipo -archs app-check/Conn.app/Contents/MacOS/conn-app)
          echo "archs: $archs"
          case "$archs" in
            *x86_64*) ;;
            *) echo "no x86_64 slice" >&2; exit 1 ;;
          esac
          case "$archs" in
            *arm64*) ;;
            *) echo "no arm64 slice" >&2; exit 1 ;;
          esac

      # --print-env answers before any window code runs, so this starts the binary without a
      # display. The marker begins with a NUL byte, so only its visible text is searched for.
      - name: Check that the binary starts
        run: |
          set -eu
          app-check/Conn.app/Contents/MacOS/conn-app --print-env > app-check/env.out
          tr -d '\0' < app-check/env.out | grep -q CONN-ENV
