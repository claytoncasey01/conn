version: "2"

linters:
  # Everything on, then opt out below with a reason for each.
  default: all
  disable:
    - exhaustruct # demands every field on stdlib structs like http.Server and exec.Cmd
    - exhaustruct_v5 # same check, new major version
    - gomodguard # deprecated; gomodguard_v2 replaces it and stays enabled
    - wsl # deprecated; wsl_v5 replaces it and stays enabled
  settings:
    depguard:
      rules:
        main:
          # Standard library and this module only. A new third-party dependency is a
          # deliberate decision: add it here in the same change that adds it to go.mod.
          allow:
            - $gostd
            - github.com/claytoncasey01/conn
    gosec:
      excludes:
        # Conn's job is running gh, git, ps and claude with arguments built from settings and
        # GitHub data. Arguments always go to exec directly, never through a shell.
        - G204
        # Conn reads files at paths it is configured with or finds: Claude Code's transcripts,
        # the settings file, repository folders.
        - G304
    ireturn:
      # The defaults, plus generic: a type parameter is a concrete type at each call, not an
      # interface the caller has to unwrap.
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
    lll:
      # TigerStyle's hard limit. Tabs count as 4, so the limit matches what an editor shows.
      line-length: 100
      tab-width: 4
    varnamelen:
      ignore-names:
        - tt # idiomatic loop variable in table-driven tests
      ignore-decls:
        - w http.ResponseWriter
        - r *http.Request
  exclusions:
    rules:
      # Table-driven tests are long and repeat literals by design.
      - path: _test\.go
        linters:
          - funlen
          - goconst
      # Tests stand in for gh, git and claude with small executable scripts, which need the
      # owner's execute bit, start the test binary itself as a child server (G702), make
      # folders and files as a person would by hand, to compare an install's modes with (G301),
      # and read and write the temp folders they made (G703).
      - path: _test\.go
        linters:
          - gosec
        text: "G301|G302|G306|G702|G703"
      # A gallery install makes its folder and files as mkdir and a plain write do, the umask
      # taking its share, so an installed theme has the modes a hand-made one has (Bun's too).
      - path: internal/gallery/files\.go
        linters:
          - gosec
        text: "G301|G302|G306"
      # The theme stylesheet route writes a theme's own CSS, which is the point of it: it goes out
      # as text/css with nosniff, only for a theme that passed its checks and, for a user's own,
      # only for the hash the user said yes to.
      - path: internal/server/themes\.go
        linters:
          - gosec
        text: "G705"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
    goimports:
      local-prefixes:
        - github.com/claytoncasey01/conn
